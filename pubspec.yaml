name: freedom_music
description: Local MP3 player for Windows. Metadata is the source of truth.
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.5.0
  audio_metadata_reader: ^1.4.1
  sqflite_common_ffi: ^2.3.6
  sqlite3: ^2.7.5
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  collection: ^1.19.1
  google_fonts: ^6.2.1
  file_picker: ^8.3.7
  archive: ^4.5.2
  window_manager: ^0.5.2
  tray_manager: ^0.8.0
  audio_service: ^0.18.19
  audio_service_win: ^0.0.3
  ffi: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
